name: Personal CI

on:
    push:
        branches:
            - personal
    pull_request:
        branches:
            - personal

concurrency:
    group: personal-ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        if: github.repository == 'tparsons9/zotflow'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test upstream functionality
              run: npm test

            - name: Test personal tooling
              run: npm run test:personal

            - name: Build release artifacts
              run: npm run build:ci

            - name: Test reader
              run: npm test --prefix reader/reader
