name: Check upstream updates

on:
    schedule:
        - cron: "17 15 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: upstream-check
    cancel-in-progress: false

jobs:
    check:
        if: github.repository == 'tparsons9/zotflow'
        runs-on: ubuntu-latest
        env:
            GH_REPO: tparsons9/zotflow
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Check releases and reader commits
              run: node scripts/upstream-check.mjs
